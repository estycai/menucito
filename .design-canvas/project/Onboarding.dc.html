<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear mi restaurante</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:#1C1917}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="min-height:880px;box-sizing:border-box;padding:40px 24px;background:#F7F5F2;font-family:'DM Sans',system-ui,sans-serif;color:#1C1917;display:flex;flex-direction:column;align-items:center;gap:32px">
  <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px">menucito<span style="color:#C2410C">.</span></span>
  <div style="width:100%;max-width:560px;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:700;color:#57534E">Paso 1 de 3 · Tu local</span>
      <div style="display:flex;gap:6px"><span style="flex:1;height:6px;border-radius:99px;background:#C2410C"></span><span style="flex:1;height:6px;border-radius:99px;background:#E7E2DC"></span><span style="flex:1;height:6px;border-radius:99px;background:#E7E2DC"></span></div>
    </div>
    <div style="background:#fff;border:1px solid #E7E2DC;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:20px">
      <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.1">Contanos de tu local</h1>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">Nombre del local
        <input type="text" value="Lo de Marta" style="height:48px;box-sizing:border-box;border:1px solid #E7E2DC;border-radius:12px;padding:0 14px;font:400 16px 'DM Sans',sans-serif;color:#1C1917;background:#fff">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">Tu link
        <div style="display:flex;align-items:center;height:48px;box-sizing:border-box;border:1px solid #E7E2DC;border-radius:12px;overflow:hidden;background:#fff">
          <span style="padding:0 12px;background:#F5F3EF;height:100%;display:flex;align-items:center;font-weight:400;color:#57534E;font-size:15px">menucito.com/</span>
          <input type="text" value="lo-de-marta" style="flex:1;min-width:0;height:100%;border:0;padding:0 12px;font:400 16px 'DM Sans',sans-serif;color:#1C1917;background:#fff">
        </div>
        <span style="font-size:12px;font-weight:400;color:#166534">Disponible. Este link va en tu QR y en tus redes.</span>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">WhatsApp para recibir pedidos
        <input type="tel" value="011 15 1234-5678" style="height:48px;box-sizing:border-box;border:1px solid #E7E2DC;border-radius:12px;padding:0 14px;font:400 16px 'DM Sans',sans-serif;color:#1C1917;background:#fff">
        <span style="font-size:12px;font-weight:400;color:#57534E">Con código de área. Nosotros armamos el link internacional.</span>
      </label>
      <fieldset style="margin:0;padding:0;border:0;display:flex;gap:12px;flex-wrap:wrap">
        <legend style="padding:0;font-size:13px;font-weight:700;margin-bottom:8px">¿Cómo entregás?</legend>
        <label style="flex:1 1 180px;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;background:#FFF7ED;border:2px solid #C2410C;border-radius:12px;font-size:15px;box-sizing:border-box"><input type="checkbox" checked style="accent-color:#C2410C;width:20px;height:20px;margin:0"> Retiro en el local</label>
        <label style="flex:1 1 180px;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;background:#FFF7ED;border:2px solid #C2410C;border-radius:12px;font-size:15px;box-sizing:border-box"><input type="checkbox" checked style="accent-color:#C2410C;width:20px;height:20px;margin:0"> Envío a domicilio</label>
      </fieldset>
      <div style="display:flex;justify-content:flex-end;margin-top:4px">
        <a href="Resumen.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;border-radius:14px;background:#C2410C;color:#fff;font-weight:700;font-size:16px">Continuar</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
